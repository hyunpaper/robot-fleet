name: Review

# Claude 코드 리뷰. 머지를 막아야 할 결함이 있으면 체크를 실패시킨다.
on:
  pull_request:
    branches: [main, "release/**"]
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # 초안과 포크 PR은 건너뛴다(포크에는 시크릿이 전달되지 않는다).
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Claude review
        id: review
        uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            이 PR을 리뷰하세요. 리뷰는 한국어로 씁니다.
            저장소: ${{ github.repository }}, PR 번호: ${{ github.event.pull_request.number }}

            1. `gh pr view` 와 `gh pr diff` 로 PR 설명과 diff를 읽습니다.
            2. 바뀐 코드의 주변을 읽어 맥락을 확인합니다. CLAUDE.md와 docs/의 설계 · 안전성 불변식을 기준으로 봅니다.
            3. 실제 결함만 지적합니다: 버그, 설계 문서와 어긋난 동작, 불변식 위반, 예외 · 경계 조건 누락, 보안.
               스타일 · 취향 · 코드 커버리지는 지적하지 않습니다.
            4. 지적마다 해당 줄에 mcp__github_inline_comment__create_inline_comment 로 인라인 코멘트를 답니다.
               CLAUDE.md "재작업 지시 형식"(위치 · 문제 · 기대 · 확인)을 따릅니다.
            5. 요약을 `gh pr comment --body-file <파일>` 로 한 번 남깁니다. 지적 건수와 머지 전 반드시 고칠 항목을 씁니다.
            6. 마지막 응답은 지정된 JSON 스키마로만 답합니다. 머지를 막아야 할 결함(유실 · 중복, 불변식 위반,
               명백한 런타임 오류, 보안)이 하나라도 있으면 blocking = true, blocking_count = 그 건수입니다.
          claude_args: |
            --max-turns 20
            --model claude-opus-5-5
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*)"
            --json-schema '{"type":"object","properties":{"blocking":{"type":"boolean"},"blocking_count":{"type":"integer"}},"required":["blocking","blocking_count"]}'

      - name: Fail on blocking findings
        if: ${{ steps.review.outputs.structured_output != '' && fromJSON(steps.review.outputs.structured_output).blocking }}
        run: |
          echo "머지를 막는 지적이 있다. PR 리뷰 코멘트를 확인한다."
          exit 1
